<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Work Sans', Arial, sans-serif; }
    a { color: #2645F5; } a:hover { color: #1730B0; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#FFFDF7; position:relative; overflow:hidden; display:flex; flex-direction:column; padding:24px 22px; color:#14141A;">

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div style="font-family:'Unbounded', sans-serif; font-weight:800; font-size:18px; transform:rotate(-2deg);">Both/And</div>
    <div style="font-family:'Unbounded', sans-serif; font-weight:700; font-size:9px; padding:5px 9px; background:#2645F5; color:#fff; border:2px solid #14141A;">EXPERT</div>
  </div>

  <div style="font-family:'Unbounded', sans-serif; font-weight:700; font-size:14px; margin-top:16px; transform:rotate(-1deg);">TODAY'S FUNNIEST</div>

  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:14px;">
    <div style="background:#FFD400; border:3px solid #14141A; padding:12px 8px; transform:rotate(-1deg); box-shadow:4px 4px 0 #14141A;">
      <svg width="190" height="168" viewBox="0 0 360 320">
        <circle cx="180" cy="110" r="100" fill="#2645F5" stroke="#14141A" stroke-width="3.5"/>
        <circle cx="130" cy="195" r="100" fill="#FF3E8E" stroke="#14141A" stroke-width="3.5" style="mix-blend-mode:multiply"/>
        <circle cx="230" cy="195" r="100" fill="#FFD400" stroke="#14141A" stroke-width="3.5" style="mix-blend-mode:multiply"/>

        <text x="180" y="62" font-size="12" font-weight="600" text-anchor="middle" font-family="Work Sans" fill="#14141A" stroke="#FFFDF7" stroke-width="3" paint-order="stroke">CATS</text>
        <text x="60" y="238" font-size="11" font-weight="600" text-anchor="middle" font-family="Work Sans" fill="#14141A" stroke="#FFFDF7" stroke-width="3" paint-order="stroke">HEROES</text>
        <text x="300" y="238" font-size="10" font-weight="600" text-anchor="middle" font-family="Work Sans" fill="#14141A" stroke="#FFFDF7" stroke-width="3" paint-order="stroke">VILLAINS</text>

        <text x="122" y="138" font-size="10" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#14141A" stroke="#FFFDF7" stroke-width="3.5" paint-order="stroke">CAT HERO</text>
        <text x="238" y="138" font-size="9" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#14141A" stroke="#FFFDF7" stroke-width="3.5" paint-order="stroke">CAT VILLAIN</text>
        <text x="180" y="260" font-size="10" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#14141A" stroke="#FFFDF7" stroke-width="3.5" paint-order="stroke">ANTIHERO</text>
        <text x="180" y="190" font-size="12" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#14141A" stroke="#FFFDF7" stroke-width="4" paint-order="stroke">CATWOMAN</text>
      </svg>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.6 5.3 5.9.9-4.2 4.1 1 5.9-5.3-2.8-5.3 2.8 1-5.9-4.2-4.1 5.9-.9L12 3z" stroke="#14141A" stroke-width="1.75" stroke-linejoin="round"/></svg>
      <div style="font-family:'Unbounded'; font-weight:700; font-size:12px;">68% of votes</div>
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; gap:14px; margin-top:20px; justify-content:center;">
    <div>
      <div style="font-family:'Unbounded'; font-weight:600; font-size:11px; margin-bottom:6px;">"CLAW-FUL AVENGER"</div>
      <div style="width:100%; height:16px; background:#f0f0e8; border:2px solid #14141A;"><div style="width:40%; height:100%; background:#2645F5;"></div></div>
    </div>
    <div>
      <div style="font-family:'Unbounded'; font-weight:600; font-size:11px; margin-bottom:6px;">"NINE-LIVES VIGILANTE"</div>
      <div style="width:100%; height:16px; background:#f0f0e8; border:2px solid #14141A;"><div style="width:22%; height:100%; background:#FF3E8E;"></div></div>
    </div>
  </div>

  <div style="display:flex; justify-content:space-around; align-items:center; margin-top:16px; padding-top:14px; border-top:2.5px solid #14141A;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="12" r="7" stroke="#a8a8a0" stroke-width="2"/><circle cx="15" cy="12" r="7" stroke="#a8a8a0" stroke-width="2"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#a8a8a0;">TODAY</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-9.3-8.8C1 8 2.4 4.8 5.6 4.1c2-.4 3.8.6 4.9 2.2 1.1-1.6 2.9-2.6 4.9-2.2 3.2.7 4.6 3.9 2.9 7.1C19 15.6 12 20 12 20z" stroke="#14141A" stroke-width="2" stroke-linejoin="round"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#14141A;">VOTE</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#a8a8a0" stroke-width="2"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke="#a8a8a0" stroke-width="2" stroke-linecap="round"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#a8a8a0;">PROFILE</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="1.5" stroke="#a8a8a0" stroke-width="2"/><path d="M3 7l2-3h14l2 3" stroke="#a8a8a0" stroke-width="2" stroke-linejoin="round"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#a8a8a0;">ARCHIVE</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
