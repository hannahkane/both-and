<body>
<x-dc>

<div style="width:390px; height:844px; background:#FFFDF7; position:relative; overflow:hidden; display:flex; flex-direction:column; padding:26px 22px; color:#14141A;">

  <div style="display:flex; justify-content:space-between; align-items:center; z-index:1;">

    </div>

    <div style="font-family:'Unbounded', sans-serif; font-weight:800; font-size:24px; transform:rotate(-2deg);">LOCKED IN!</div>

    <div style="font-family:'Unbounded', sans-serif; font-weight:700; font-size:11px; padding:8px 16px; background:#fff; border:2.5px solid #14141A;">5-DAY STREAK</div>

  </div>

  <div style="width:100%; padding:16px; background:#2645F5; color:#fff; border:2.5px solid #14141A; font-family:'Unbounded'; font-weight:700; font-size:13px; text-align:center; z-index:1; box-shadow:5px 5px 0 #FFD400;">SEE OTHER ANSWERS</div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-9.3-8.8C1 8 2.4 4.8 5.6 4.1c2-.4 3.8.6 4.9 2.2 1.1-1.6 2.9-2.6 4.9-2.2 3.2.7 4.6 3.9 2.9 7.1C19 15.6 12 20 12 20z" stroke="#a8a8a0" stroke-width="2" stroke-linejoin="round"/></svg>

      <div style="font-family:'Unbounded'; font-size:8px; color:#a8a8a0;">PROFILE</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="1.5" stroke="#a8a8a0" stroke-width="2"/><path d="M3 7l2-3h14l2 3" stroke="#a8a8a0" stroke-width="2" stroke-linejoin="round"/></svg>
