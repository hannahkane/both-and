<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Work Sans', Arial, sans-serif; }
    a { color: #2645F5; } a:hover { color: #1730B0; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#FFFDF7; position:relative; overflow:hidden; display:flex; flex-direction:column; padding:26px 22px; color:#14141A;">

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div style="font-family:'Unbounded', sans-serif; font-weight:800; font-size:20px; transform:rotate(-2deg);">Both/And</div>
    <div style="font-family:'Unbounded', sans-serif; font-weight:700; font-size:10px; padding:6px 11px; background:#FF3E8E; color:#fff; border:2px solid #14141A;">3 VOTES LEFT</div>
  </div>

  <div style="display:flex; gap:6px; margin-top:16px;">
    <div style="flex:1; text-align:center; padding:8px 0; color:#6b6b74; border:2.5px solid #d8d8d0; font-family:'Unbounded'; font-weight:700; font-size:10px; transform:skewX(-6deg);">NOVICE</div>
    <div style="flex:1; text-align:center; padding:8px 0; background:#2645F5; color:#fff; border:2.5px solid #14141A; font-family:'Unbounded'; font-weight:700; font-size:10px; transform:skewX(-6deg);">EXPERT</div>
  </div>

  <div style="display:flex; align-items:center; justify-content:center; gap:14px; margin-top:16px;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#14141A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="font-family:'Unbounded'; font-weight:700; font-size:11px; letter-spacing:0.03em;">SUBMISSION 4 OF 12</div>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#14141A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;">

    <div style="background:#fff; border:2.5px solid #14141A; padding:16px 10px; transform:rotate(-1deg); box-shadow:4px 4px 0 #FFD400;">
      <svg width="270" height="240" viewBox="0 0 360 320">
        <circle cx="180" cy="110" r="100" fill="#2645F5" stroke="#14141A" stroke-width="3.5"/>
        <circle cx="130" cy="195" r="100" fill="#FF3E8E" stroke="#14141A" stroke-width="3.5" style="mix-blend-mode:multiply"/>
        <circle cx="230" cy="195" r="100" fill="#FFD400" stroke="#14141A" stroke-width="3.5" style="mix-blend-mode:multiply"/>

        <text x="180" y="62" font-size="13" font-weight="600" text-anchor="middle" font-family="Work Sans" fill="#14141A" stroke="#FFFDF7" stroke-width="3" paint-order="stroke">CATS</text>
        <text x="60" y="240" font-size="12" font-weight="600" text-anchor="middle" font-family="Work Sans" fill="#14141A" stroke="#FFFDF7" stroke-width="3" paint-order="stroke">HEROES</text>
        <text x="300" y="240" font-size="11" font-weight="600" text-anchor="middle" font-family="Work Sans" fill="#14141A" stroke="#FFFDF7" stroke-width="3" paint-order="stroke">VILLAINS</text>

        <text x="122" y="138" font-size="11" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#14141A" stroke="#FFFDF7" stroke-width="3.5" paint-order="stroke">CAT HERO</text>
        <text x="238" y="138" font-size="10" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#14141A" stroke="#FFFDF7" stroke-width="3.5" paint-order="stroke">CAT VILLAIN</text>
        <text x="180" y="262" font-size="11" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#14141A" stroke="#FFFDF7" stroke-width="3.5" paint-order="stroke">ANTIHERO</text>
        <text x="180" y="190" font-size="13" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#14141A" stroke="#FFFDF7" stroke-width="4" paint-order="stroke">CATWOMAN</text>
      </svg>
    </div>

  </div>

  <div style="display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px; background:#14141A; border:2.5px solid #14141A; box-shadow:5px 5px 0 #FF3E8E;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-9.3-8.8C1 8 2.4 4.8 5.6 4.1c2-.4 3.8.6 4.9 2.2 1.1-1.6 2.9-2.6 4.9-2.2 3.2.7 4.6 3.9 2.9 7.1C19 15.6 12 20 12 20z" stroke="#FFFDF7" stroke-width="2" stroke-linejoin="round"/></svg>
    <div style="font-family:'Unbounded'; font-weight:700; font-size:13px; color:#FFFDF7;">VOTE FOR THIS ONE</div>
  </div>

  <div style="display:flex; justify-content:space-around; align-items:center; margin-top:20px; padding-top:16px; border-top:2.5px solid #14141A;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="12" r="7" stroke="#a8a8a0" stroke-width="2"/><circle cx="15" cy="12" r="7" stroke="#a8a8a0" stroke-width="2"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#a8a8a0;">TODAY</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-9.3-8.8C1 8 2.4 4.8 5.6 4.1c2-.4 3.8.6 4.9 2.2 1.1-1.6 2.9-2.6 4.9-2.2 3.2.7 4.6 3.9 2.9 7.1C19 15.6 12 20 12 20z" stroke="#14141A" stroke-width="2" stroke-linejoin="round"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#14141A;">VOTE</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#a8a8a0" stroke-width="2"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke="#a8a8a0" stroke-width="2" stroke-linecap="round"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#a8a8a0;">PROFILE</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="1.5" stroke="#a8a8a0" stroke-width="2"/><path d="M3 7l2-3h14l2 3" stroke="#a8a8a0" stroke-width="2" stroke-linejoin="round"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#a8a8a0;">ARCHIVE</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
