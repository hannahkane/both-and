<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Work Sans', Arial, sans-serif; }
    a { color: #2645F5; } a:hover { color: #1730B0; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#FFFDF7; position:relative; overflow:hidden; display:flex; flex-direction:column; padding:22px 22px; color:#14141A;">

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div style="font-family:'Unbounded', sans-serif; font-weight:800; font-size:18px; transform:rotate(-2deg);">Both/And</div>
    <div style="font-family:'Unbounded', sans-serif; font-weight:700; font-size:9px; padding:5px 9px; background:#2645F5; color:#fff; border:2px solid #14141A;">EXPERT</div>
  </div>

  <div style="display:flex; align-items:center; justify-content:center; margin-top:14px;">
    <svg width="200" height="176" viewBox="0 0 360 320">
      <circle cx="180" cy="110" r="100" fill="#2645F5" stroke="#14141A" stroke-width="3.5"/>
      <circle cx="130" cy="195" r="100" fill="#FF3E8E" stroke="#14141A" stroke-width="3.5" style="mix-blend-mode:multiply"/>
      <circle cx="230" cy="195" r="100" fill="#FFD400" stroke="#14141A" stroke-width="3.5" style="mix-blend-mode:multiply"/>

      <text x="180" y="62" font-size="13" font-weight="600" text-anchor="middle" font-family="Work Sans" fill="#14141A" stroke="#FFFDF7" stroke-width="3" paint-order="stroke">CATS</text>
      <text x="60" y="240" font-size="12" font-weight="600" text-anchor="middle" font-family="Work Sans" fill="#14141A" stroke="#FFFDF7" stroke-width="3" paint-order="stroke">HEROES</text>
      <text x="300" y="240" font-size="11" font-weight="600" text-anchor="middle" font-family="Work Sans" fill="#14141A" stroke="#FFFDF7" stroke-width="3" paint-order="stroke">VILLAINS</text>

      <text x="122" y="138" font-size="11" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#14141A" stroke="#FFFDF7" stroke-width="3.5" paint-order="stroke">CAT HERO</text>
      <text x="238" y="138" font-size="10" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#14141A" stroke="#FFFDF7" stroke-width="3.5" paint-order="stroke">CAT VILLAIN</text>
      <text x="180" y="262" font-size="11" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#14141A" stroke="#FFFDF7" stroke-width="3.5" paint-order="stroke">ANTIHERO</text>

      <circle cx="180" cy="185" r="26" fill="#fff" stroke="#FF3E8E" stroke-width="3" stroke-dasharray="5,4"/>
      <text x="180" y="192" font-size="18" font-weight="800" text-anchor="middle" font-family="Unbounded" fill="#FF3E8E">?</text>
    </svg>
  </div>

  <div style="font-size:10px; color:#6b6b74; text-align:center; margin-top:2px;">3 of 4 filled &mdash; one more to go</div>

  <div style="flex:1; display:flex; flex-direction:column; gap:8px; margin-top:14px; justify-content:center;">

    <div style="display:flex; align-items:center; gap:10px; padding:9px 12px; background:#fff; border:2px solid #14141A; transform:rotate(-1deg);">
      <div style="width:22px; height:22px; border-radius:50%; background:#14141A; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Unbounded'; font-size:10px; flex-shrink:0;">1</div>
      <div style="flex:1; font-size:10px; color:#6b6b74;">Cats + Heroes</div>
      <div style="font-family:'Unbounded'; font-weight:700; font-size:11px;">CAT HERO</div>
    </div>

    <div style="display:flex; align-items:center; gap:10px; padding:9px 12px; background:#fff; border:2px solid #14141A; transform:rotate(1deg);">
      <div style="width:22px; height:22px; border-radius:50%; background:#14141A; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Unbounded'; font-size:10px; flex-shrink:0;">2</div>
      <div style="flex:1; font-size:10px; color:#6b6b74;">Cats + Villains</div>
      <div style="font-family:'Unbounded'; font-weight:700; font-size:11px;">CAT VILLAIN</div>
    </div>

    <div style="display:flex; align-items:center; gap:10px; padding:9px 12px; background:#fff; border:2px solid #14141A; transform:rotate(-1deg);">
      <div style="width:22px; height:22px; border-radius:50%; background:#14141A; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Unbounded'; font-size:10px; flex-shrink:0;">3</div>
      <div style="flex:1; font-size:10px; color:#6b6b74;">Heroes + Villains</div>
      <div style="font-family:'Unbounded'; font-weight:700; font-size:11px;">ANTIHERO</div>
    </div>

    <div style="display:flex; align-items:center; gap:10px; padding:9px 12px; background:#fff; border:2.5px solid #FF3E8E; transform:rotate(1deg); box-shadow:2px 2px 0 #FF3E8E;">
      <div style="width:22px; height:22px; border-radius:50%; background:#FF3E8E; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Unbounded'; font-size:10px; flex-shrink:0;">4</div>
      <div style="flex:1; font-size:10px; color:#6b6b74;">All three</div>
      <div style="display:flex; align-items:center; gap:2px;">
        <div style="font-size:11px; color:#a8a8a0; font-style:italic;">Type here&hellip;</div>
        <div style="width:2px; height:14px; background:#FF3E8E;"></div>
      </div>
    </div>

  </div>

  <div style="width:100%; padding:14px; background:#14141A; color:#FFFDF7; border:2.5px solid #14141A; font-family:'Unbounded'; font-weight:700; font-size:13px; text-align:center; margin-top:14px; box-shadow:5px 5px 0 #FFD400;">SUBMIT</div>

  <div style="display:flex; justify-content:space-around; align-items:center; margin-top:16px; padding-top:14px; border-top:2.5px solid #14141A;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="12" r="7" stroke="#14141A" stroke-width="2"/><circle cx="15" cy="12" r="7" stroke="#14141A" stroke-width="2"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#14141A;">TODAY</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-9.3-8.8C1 8 2.4 4.8 5.6 4.1c2-.4 3.8.6 4.9 2.2 1.1-1.6 2.9-2.6 4.9-2.2 3.2.7 4.6 3.9 2.9 7.1C19 15.6 12 20 12 20z" stroke="#a8a8a0" stroke-width="2" stroke-linejoin="round"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#a8a8a0;">VOTE</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#a8a8a0" stroke-width="2"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke="#a8a8a0" stroke-width="2" stroke-linecap="round"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#a8a8a0;">PROFILE</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="1.5" stroke="#a8a8a0" stroke-width="2"/><path d="M3 7l2-3h14l2 3" stroke="#a8a8a0" stroke-width="2" stroke-linejoin="round"/></svg>
      <div style="font-family:'Unbounded'; font-size:8px; color:#a8a8a0;">ARCHIVE</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
