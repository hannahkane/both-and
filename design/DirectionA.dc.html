<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Work Sans', 'Helvetica Neue', Arial, sans-serif; }
    a { color: #2f6b4f; } a:hover { color: #1f4a35; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#FAF7F1; display:flex; flex-direction:column; padding:28px 24px; color:#1c1c1a;">

  <div style="display:flex; justify-content:space-between; align-items:baseline; padding-bottom:16px; border-bottom:1px solid #e5e0d5;">
    <div style="font-family:'Lora', Georgia, serif; font-weight:700; font-size:24px;">Both/And</div>
    <div style="font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#8a8577;">5-day streak</div>
  </div>

  <div style="font-size:12px; color:#8a8577; margin-top:14px; letter-spacing:0.04em;">Thursday, March&nbsp;12</div>

  <div style="display:flex; gap:24px; margin-top:22px; font-size:14px; letter-spacing:0.02em;">
    <div style="font-weight:600; color:#1c1c1a; padding-bottom:6px; border-bottom:2px solid #2f6b4f;">Novice</div>
    <div style="color:#a39d8c; padding-bottom:6px;">Expert</div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;">
    <svg width="300" height="230" viewBox="0 0 360 280" fill="none">
      <circle cx="140" cy="150" r="100" stroke="#1c1c1a" stroke-width="1.75"/>
      <circle cx="240" cy="150" r="100" stroke="#1c1c1a" stroke-width="1.75"/>
      <text x="55" y="80" font-size="15" letter-spacing="1.5" fill="#8a8577" font-family="Work Sans">CATS</text>
      <text x="255" y="80" font-size="15" letter-spacing="1.5" fill="#8a8577" font-family="Work Sans">SUPERHEROES</text>
    </svg>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:-56px;">
      <div style="font-family:'Lora', Georgia, serif; font-style:italic; font-size:15px; color:#1c1c1a;">what belongs to both?</div>
      <div style="font-size:12px; color:#2f6b4f; border-bottom:1px solid #2f6b4f; padding-bottom:1px;">tap to answer &rarr;</div>
    </div>
  </div>

  <div style="width:100%; padding:15px; border-radius:4px; background:#1c1c1a; color:#FAF7F1; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; text-align:center;">Fill in your answer</div>

  <div style="display:flex; justify-content:space-around; align-items:center; margin-top:22px; padding-top:16px; border-top:1px solid #e5e0d5;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="12" r="7" stroke="#1c1c1a" stroke-width="1.5"/><circle cx="15" cy="12" r="7" stroke="#1c1c1a" stroke-width="1.5"/></svg>
      <div style="font-size:9px; letter-spacing:0.05em; text-transform:uppercase; color:#1c1c1a;">Today</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-9.3-8.8C1 8 2.4 4.8 5.6 4.1c2-.4 3.8.6 4.9 2.2 1.1-1.6 2.9-2.6 4.9-2.2 3.2.7 4.6 3.9 2.9 7.1C19 15.6 12 20 12 20z" stroke="#a39d8c" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <div style="font-size:9px; letter-spacing:0.05em; text-transform:uppercase; color:#a39d8c;">Vote</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#a39d8c" stroke-width="1.5"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke="#a39d8c" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div style="font-size:9px; letter-spacing:0.05em; text-transform:uppercase; color:#a39d8c;">Profile</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="1.5" stroke="#a39d8c" stroke-width="1.5"/><path d="M3 7l2-3h14l2 3" stroke="#a39d8c" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <div style="font-size:9px; letter-spacing:0.05em; text-transform:uppercase; color:#a39d8c;">Archive</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
