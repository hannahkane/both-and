<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Mono', monospace; }
    a { color: #00F0FF; } a:hover { color: #7CFBFF; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:radial-gradient(circle at 50% 0%, #141833 0%, #0B0E1A 60%); display:flex; flex-direction:column; padding:26px 22px; color:#E8ECF7;">

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div style="font-family:'Press Start 2P', monospace; font-size:14px; color:#00F0FF; text-shadow:0 0 8px rgba(0,240,255,0.7);">Both/And</div>
    <div style="font-size:10px; padding:5px 10px; border:1px solid #FF2E9A; border-radius:3px; color:#FF2E9A; text-shadow:0 0 6px rgba(255,46,154,0.6);">5-DAY STREAK</div>
  </div>

  <div style="font-size:11px; color:#5A6180; margin-top:14px; letter-spacing:0.05em;">THU // 03.12</div>

  <div style="display:flex; gap:0; margin-top:20px; border:1px solid #2A2F52; border-radius:2px; overflow:hidden;">
    <div style="flex:1; text-align:center; padding:9px 0; background:rgba(0,240,255,0.12); color:#00F0FF; font-size:12px; letter-spacing:0.05em; border-right:1px solid #2A2F52;">NOVICE</div>
    <div style="flex:1; text-align:center; padding:9px 0; color:#5A6180; font-size:12px; letter-spacing:0.05em;">EXPERT</div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;">
    <svg width="290" height="220" viewBox="0 0 360 280">
      <circle cx="140" cy="150" r="100" fill="none" stroke="#00F0FF" stroke-width="2" style="filter:drop-shadow(0 0 6px #00F0FF)"/>
      <circle cx="240" cy="150" r="100" fill="none" stroke="#FF2E9A" stroke-width="2" style="filter:drop-shadow(0 0 6px #FF2E9A)"/>
      <text x="58" y="86" font-size="13" letter-spacing="2" fill="#7CFBFF" font-family="IBM Plex Mono">CATS</text>
      <text x="250" y="86" font-size="13" letter-spacing="2" fill="#FF8FC6" font-family="IBM Plex Mono">HEROES</text>
    </svg>
    <div style="margin-top:-56px; padding:8px 16px; border:1px solid #7A3EFF; border-radius:3px; background:rgba(122,62,255,0.12); text-shadow:0 0 6px rgba(122,62,255,0.8);">
      <div style="font-size:11px; color:#C9AFFF;">&gt; TAP_TO_ANSWER_</div>
    </div>
  </div>

  <div style="width:100%; padding:15px; border:1.5px solid #00F0FF; border-radius:3px; background:rgba(0,240,255,0.08); color:#00F0FF; font-size:12px; letter-spacing:0.08em; text-align:center; text-shadow:0 0 8px rgba(0,240,255,0.7); box-shadow:0 0 14px rgba(0,240,255,0.25);">FILL IN YOUR ANSWER</div>

  <div style="display:flex; justify-content:space-around; align-items:center; margin-top:20px; padding-top:16px; border-top:1px solid #2A2F52;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="filter:drop-shadow(0 0 4px #00F0FF)"><circle cx="9" cy="12" r="7" stroke="#00F0FF" stroke-width="1.5"/><circle cx="15" cy="12" r="7" stroke="#00F0FF" stroke-width="1.5"/></svg>
      <div style="font-size:8px; color:#00F0FF; letter-spacing:0.05em;">TODAY</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-9.3-8.8C1 8 2.4 4.8 5.6 4.1c2-.4 3.8.6 4.9 2.2 1.1-1.6 2.9-2.6 4.9-2.2 3.2.7 4.6 3.9 2.9 7.1C19 15.6 12 20 12 20z" stroke="#4A5074" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <div style="font-size:8px; color:#4A5074; letter-spacing:0.05em;">VOTE</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#4A5074" stroke-width="1.5"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke="#4A5074" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div style="font-size:8px; color:#4A5074; letter-spacing:0.05em;">PROFILE</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="1.5" stroke="#4A5074" stroke-width="1.5"/><path d="M3 7l2-3h14l2 3" stroke="#4A5074" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <div style="font-size:8px; color:#4A5074; letter-spacing:0.05em;">ARCHIVE</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
