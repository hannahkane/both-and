<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Space Mono', monospace; }
    a { color: #2B3A55; } a:hover { color: #16202f; }
  </style>
</helmet>

<div style="width:390px; height:844px; background-color:#F3ECDC; background-image:radial-gradient(rgba(43,58,85,0.05) 1px, transparent 1.2px); background-size:7px 7px; display:flex; flex-direction:column; padding:26px 22px; color:#2B3A55;">

  <div style="display:flex; flex-direction:column;">
    <div style="font-family:'Shantell Sans', cursive; font-weight:700; font-size:27px;">Both/And</div>
    <svg width="90" height="10" viewBox="0 0 90 10" style="margin-top:-2px;"><path d="M2 6 Q 15 2, 28 6 T 54 6 T 80 6" stroke="#2B3A55" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
    <div style="font-size:11px; letter-spacing:0.05em; color:#6b6455;">THU &middot; MAR 12</div>
    <div style="font-size:11px; letter-spacing:0.05em; padding:4px 9px; border:1.5px solid #2B3A55; border-radius:3px; background:#fff;">STREAK: 05</div>
  </div>

  <div style="display:flex; gap:10px; margin-top:20px;">
    <div style="padding:8px 18px; font-family:'Shantell Sans', cursive; font-weight:700; font-size:13px; background:#E8B94A; border:2px solid #2B3A55; border-radius:255px 15px 225px 15px / 15px 225px 15px 255px;">Novice</div>
    <div style="padding:8px 18px; font-family:'Shantell Sans', cursive; font-weight:700; font-size:13px; color:#6b6455; border:2px solid #a89f8a; border-radius:15px 225px 15px 255px / 225px 15px 255px 15px;">Expert</div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;">
    <svg width="290" height="220" viewBox="0 0 360 280">
      <defs>
        <filter id="wobble" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="7"/>
        </filter>
      </defs>
      <circle cx="140" cy="150" r="100" fill="#E8B94A" fill-opacity="0.32" stroke="#2B3A55" stroke-width="3" filter="url(#wobble)"/>
      <circle cx="240" cy="150" r="100" fill="#C1603F" fill-opacity="0.32" stroke="#2B3A55" stroke-width="3" filter="url(#wobble)"/>
      <text x="60" y="85" font-size="14" fill="#2B3A55" font-family="Space Mono" font-weight="700">CATS</text>
      <text x="252" y="85" font-size="14" fill="#2B3A55" font-family="Space Mono" font-weight="700">HEROES</text>
    </svg>
    <div style="transform:rotate(-2deg); border:1.5px dashed #2B3A55; border-radius:10px; padding:8px 16px; background:#fffdf7; margin-top:-70px;">
      <div style="font-family:'Shantell Sans', cursive; font-weight:500; font-size:13px;">sketch your answer&hellip;</div>
    </div>
  </div>

  <div style="width:100%; padding:15px; border-radius:255px 15px 225px 15px/15px 225px 15px 255px; background:#E8B94A; border:2.5px solid #2B3A55; transform:rotate(-1deg); font-family:'Shantell Sans', cursive; font-weight:700; font-size:15px; text-align:center;">Fill In Your Answer</div>

  <div style="display:flex; justify-content:space-around; align-items:center; margin-top:22px; padding-top:14px; border-top:1.5px dashed #a89f8a;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="12" r="7" stroke="#2B3A55" stroke-width="1.75"/><circle cx="15" cy="12" r="7" stroke="#2B3A55" stroke-width="1.75"/></svg>
      <div style="font-size:9px; color:#2B3A55;">TODAY</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-9.3-8.8C1 8 2.4 4.8 5.6 4.1c2-.4 3.8.6 4.9 2.2 1.1-1.6 2.9-2.6 4.9-2.2 3.2.7 4.6 3.9 2.9 7.1C19 15.6 12 20 12 20z" stroke="#a89f8a" stroke-width="1.75" stroke-linejoin="round"/></svg>
      <div style="font-size:9px; color:#a89f8a;">VOTE</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#a89f8a" stroke-width="1.75"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke="#a89f8a" stroke-width="1.75" stroke-linecap="round"/></svg>
      <div style="font-size:9px; color:#a89f8a;">PROFILE</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="1.5" stroke="#a89f8a" stroke-width="1.75"/><path d="M3 7l2-3h14l2 3" stroke="#a89f8a" stroke-width="1.75" stroke-linejoin="round"/></svg>
      <div style="font-size:9px; color:#a89f8a;">ARCHIVE</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
